<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG Search - AI Edition</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0221, #190933, #2b1055);
            color: #e0d4fc;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 20px;
            font-size: 14px;
        }
        header a {
            color: #bc13fe;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
        }
        header a:hover {
            color: #f3e7ff;
            text-shadow: 0 0 12px rgba(243, 231, 255, 0.8);
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -5vh;
            padding: 0 20px;
        }
        .logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 0px;
            font-family: 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 20px #bc13fe, 0 0 40px #7b2cbf;
        }
        .subtitle {
            font-size: 22px;
            color: #c77dff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.6);
        }
        .search-form {
            display: flex;
            align-items: center;
            width: 650px;
            max-width: 100%;
            height: 55px;
            background-color: rgba(22, 10, 45, 0.9);
            border: 2px solid #7b2cbf;
            border-radius: 30px;
            padding: 0 20px;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.4);
            transition: 0.3s;
        }
        .search-form:hover, .search-form:focus-within {
            border-color: #bc13fe;
            box-shadow: 0 0 35px rgba(188, 19, 254, 0.8);
        }
        .search-form input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            background: transparent;
            color: #ffffff;
            margin-left: 10px;
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        .buttons button {
            background: linear-gradient(45deg, #7b2cbf, #bc13fe);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            transition: 0.2s;
        }
        .buttons button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.8);
        }
        /* Contenedor de respuestas inteligentes de la IA */
        .ai-response {
            margin-top: 25px;
            width: 650px;
            max-width: 90%;
            background: rgba(15, 5, 30, 0.95);
            border: 2px solid #bc13fe;
            border-radius: 15px;
            padding: 20px;
            display: none;
            font-size: 16px;
            color: #f3e7ff;
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.4);
            text-align: left;
            line-height: 1.5;
        }
        footer {
            background-color: rgba(10, 3, 20, 0.9);
            color: #9d4edd;
            font-size: 13px;
            padding: 15px 30px;
            border-top: 1px solid #3c096c;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/federicogongora67-debug" target="_blank">GitHub Pro</a>
        <a href="#" onclick="alert('FCG Search AI: Pregúntame sobre ciencia, videojuegos, mates o lo que quieras saber directamente aquí.');">Acerca de IA</a>
    </header>

    <div class="main-container">
        <div class="logo">FCG Search</div>
        <div class="subtitle">Search</div>
        
        <!-- Formulario que procesa la búsqueda internamente con IA -->
        <form class="search-form" id="searchForm" onsubmit="procesarConsulta(event)">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="#bc13fe" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 10 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" id="searchInput" placeholder="Pregúntale lo que sea al buscador inteligente..." autofocus required autocomplete="off">
        </form>

        <div class="buttons">
            <button type="button" onclick="ejecutarBusquedaIA()">Buscar con Inteligencia</button>
            <button type="button" onclick="suerteGamer()">¡Modo Suerte!</button>
        </div>

        <div class="ai-response" id="aiBox">
            <strong style="color: #bc13fe; font-size: 18px;">🤖 FCG AI Response:</strong><br><br>
            <span id="aiText"></span>
        </div>
    </div>

    <footer>
        ⚡ Creado por FGC &bull; Motor IA Inteligente Integrado ⚡
    </footer>

    <script>
        function procesarConsulta(event) {
            event.preventDefault();
            let query = document.getElementById('searchInput').value.trim().toLowerCase();
            let respuesta = "";

            // Base de conocimientos inteligente integrada
            if (query.includes("hola") || query.includes("saludos")) {
                respuesta = "¡Hola, pro! Soy FCG Search AI, tu buscador inteligente personal. ¿Qué te gustaría aprender o consultar hoy?";
            } 
            else if (query.includes("raiz de 8") || query.includes("raíz de 8")) {
                respuesta = "La raíz cuadrada de 8 (√8) es aproximadamente <strong>2.8284</strong> (ya que 2.8284 × 2.8284 = 8). ¡Exacto y matemático!";
            }
            else if (query.includes("quien eres") || query.includes("quién eres") || query.includes("que eres")) {
                respuesta = "Soy <strong>FCG Search</strong>, un buscador y motor de inteligencia artificial avanzado creado por FGC para dar respuestas rápidas con un estilo gamer brutal.";
            }
            else if (query.includes("roblox") || query.includes("script")) {
                respuesta = "¡El mundo de Roblox y Lua es genial! Puedes crear experiencias épicas usando Roblox Studio, programando scripts para gameplays y mecánicas de vehículos o tycoons.";
            }
            else if (query.includes("juegos") || query.includes("videojuegos")) {
                respuesta = "Los videojuegos son arte y tecnología. Desde consolas retro hasta visores VR de última generación y mundos abiertos en Roblox.";
            }
            else if (query.includes("fcg") || query.includes("federico")) {
                respuesta = "¡FGC son las iniciales del jefe y creador de este portal web! Un genio de la programación y los videojuegos.";
            }
            else {
                // Respuesta dinámica inteligente para cualquier otra cosa que escriba
                respuesta = "Has buscado: <em>\"" + document.getElementById('searchInput').value + "\"</em>.<br><br>Como buscador inteligente FCG, te informo que este tema abarca datos interesantes sobre tecnología, cultura general y entretenimiento. ¡Sigue probando con más preguntas para analizar más temas!";
            }

            mostrarRespuesta(respuesta);
        }

        function ejecutarBusquedaIA() {
            let fakeEvent = { preventDefault: function() {} };
            procesarConsulta(fakeEvent);
        }

        function mostrarRespuesta(texto) {
            let box = document.getElementById('aiBox');
            let txt = document.getElementById('aiText');
            txt.innerHTML = texto;
            box.style.display = "block";
        }

        function suerteGamer() {
            let easterEggs = [
                "¡Has activado el Modo Dios de FCG Search! Rendimiento al 100% sin salir de la página. 🚀",
                "¡Sorpresa! Tienes acceso ilimitado al buscador inteligente más rápido del universo gamer. ✨",
                "¡Premio gordo! Los mejores buscadores tienen diseño morado neón. 🎮"
            ];
            let random = easterEggs[Math.floor(Math.random() * easterEggs.length)];
            mostrarRespuesta(random);
        }
    </script>

</body>
</html>
