<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            background-color: #fff;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            color: #000;
        }
        header a {
            color: rgba(0,0,0,0.87);
            text-decoration: none;
        }
        header a:hover {
            text-decoration: underline;
        }
        .menu-icon {
            width: 20px;
            height: 20px;
            background: #5f6368;
            border-radius: 50%;
            display: inline-block;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -10vh;
        }
        .logo {
            font-size: 85px;
            font-weight: bold;
            letter-spacing: -4px;
            margin-bottom: 25px;
        }
        .g1 { color: #4285F4; }
        .g2 { color: #EA4335; }
        .g3 { color: #FBBC05; }
        .g4 { color: #4285F4; }
        .g5 { color: #34A853; }
        .g6 { color: #EA4335; }
        
        .search-box {
            display: flex;
            align-items: center;
            width: 580px;
            max-width: 90%;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 14px;
            box-shadow: none;
            transition: box-shadow 0.3s;
        }
        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            margin-left: 10px;
        }
        .buttons {
            margin-top: 30px;
        }
        .buttons button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 16px;
            margin: 0 4px;
            cursor: pointer;
        }
        .buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
        }
        footer {
            background-color: #f2f2f2;
            color: #70757a;
            font-size: 14px;
            width: 100%;
        }
        .footer-row {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }
        .footer-links div {
            display: flex;
            gap: 25px;
        }
        .footer-links a {
            color: #70757a;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Imágenes</a>
        <div class="menu-icon"></div>
        <a href="#" style="background: #1a73e8; color: white; padding: 7px 15px; border-radius: 4px; text-decoration: none; font-weight: bold;">Acceder</a>
    </header>

    <div class="main-container">
        <div class="logo">
            <span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g4">g</span><span class="g5">l</span><span class="g6">e</span>
        </div>
        
        <div class="search-box">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 10 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" autofocus>
        </div>

        <div class="buttons">
            <button>Buscar con Google</button>
            <button>Me siento con suerte</button>
        </div>
    </div>

    <footer>
        <div class="footer-row">Colombia</div>
        <div class="footer-links">
            <div>
                <a href="#">Sobre Google</a>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div>
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
                <a href="#">Preferencias</a>
            </div>
        </div>
    </footer>

</body>
</html>
