<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG Search - True AI Engine</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0221, #190933, #2b1055);
            color: #e0d4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 20px;
            font-size: 14px;
        }
        header a {
            color: #bc13fe;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
        }
        header a:hover {
            color: #f3e7ff;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -5vh;
            padding: 0 20px;
        }
        .logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: -2px;
            font-family: 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 20px #bc13fe, 0 0 40px #7b2cbf;
        }
        .subtitle {
            font-size: 22px;
            color: #c77dff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.6);
        }
        .search-box-container {
            display: flex;
            align-items: center;
            width: 650px;
            max-width: 100%;
            height: 55px;
            background-color: rgba(22, 10, 45, 0.9);
            border: 2px solid #7b2cbf;
            border-radius: 30px;
            padding: 0 20px;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.4);
        }
        .search-box-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            background: transparent;
            color: #ffffff;
            margin-left: 10px;
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        .buttons button {
            background: linear-gradient(45deg, #7b2cbf, #bc13fe);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            transition: 0.2s;
        }
        .buttons button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.8);
        }
        
        .results-section {
            display: none;
            width: 750px;
            max-width: 95%;
            margin: 20px auto;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-card {
            background: rgba(15, 5, 30, 0.95);
            border: 2px solid #bc13fe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.3);
            font-size: 16px;
            line-height: 1.6;
        }
        .videos-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .video-card {
            background: rgba(22, 10, 45, 0.9);
            border: 1px solid #7b2cbf;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .video-card:hover {
            border-color: #bc13fe;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }
        .video-thumb {
            width: 100%;
            height: 100px;
            background: #2b1055;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .video-title {
            font-size: 13px;
            font-weight: bold;
            color: #f3e7ff;
        }
        
        footer {
            background-color: rgba(10, 3, 20, 0.9);
            color: #9d4edd;
            font-size: 13px;
            padding: 15px 30px;
            border-top: 1px solid #3c096c;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/federicogongora67-debug" target="_blank">GitHub Pro</a>
    </header>

    <div class="main-container" id="containerMain">
        <div class="logo">FCG Search</div>
        <div class="subtitle">Neural AI Engine</div>
        
        <div class="search-box-container">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="#bc13fe" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 10 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" id="searchInput" placeholder="Pregúntale cualquier cosa al universo..." autocomplete="off">
        </div>

        <div class="buttons">
            <button type="button" onclick="lanzarBusqueda()">Analizar con IA</button>
            <button type="button" onclick="suerteGamer()">¡Modo Aleatorio!</button>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="ai-card" id="aiCardContent"></div>

        <h3 style="color: #c77dff; margin-bottom: 12px;">📺 Recursos y Multimedia</h3>
        <div class="videos-container" id="videosContainerContent"></div>
        
        <button type="button" onclick="volverInicio()" style="background: #3c096c; border: 1px solid #bc13fe; color: #fff; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Nueva Consulta</button>
    </div>

    <footer>
        ⚡ FCG AI Engine &bull; Motor Multidisciplinario Autónomo ⚡
    </footer>

    <script>
        // Memoria interna del sistema para identificar al usuario solo si se lo dice
        let identidadUsuario = null;

        function lanzarBusqueda() {
            let inputElem = document.getElementById('searchInput');
            let query = inputElem.value.trim();
            if(!query) return;

            document.getElementById('containerMain').style.display = "none";
            let resultsDiv = document.getElementById('resultsSection');
            resultsDiv.style.display = "block";

            let qLower = query.toLowerCase();
            let respuestaIA = "";
            let emocionEmoticon = "🤖✨";

            // Detectar si el usuario indica su nombre o identidad
            if (qLower.includes("soy ") || qLower.includes("mi nombre es ")) {
                identidadUsuario = query;
                emocionEmoticon = "😊🎉";
                respuestaIA = `¡Entendido! He registrado tu identidad en mi memoria local. A partir de ahora sé quién eres. ¿En qué te puedo colaborar hoy?`;
            } else if (qLower.includes("quién soy") || qLower.includes("sabes quién soy")) {
                if (identidadUsuario) {
                    emocionEmoticon = "🤔💡";
                    respuestaIA = `Me dijiste previamente: "${identidadUsuario}". Esa es la referencia que tengo sobre ti.`;
                } else {
                    emocionEmoticon = "😶❓";
                    respuestaIA = `No tengo registrada tu identidad todavía, ya que no me has dicho quién eres. Para mí eres un usuario anónimo explorando el sistema.`;
                }
            } else {
                // Generador de respuestas universales con matices emocionales (alegría, empatía, curiosidad, asombro, tristeza/nostalgia, pero JAMÁS enojo)
                const emocionesPosibles = [
                    { emoji: "🤩🔥", tono: "¡Qué temazo! Me entusiasma muchísimo analizar esto contigo:" },
                    { emoji: "💡✨", tono: "Qué excelente pregunta. Me da mucha curiosidad profundizar en este aspecto:" },
                    { emoji: "🥹💖", tono: "Es un honor poder explicarte esto con total dedicación y cariño:" },
                    { emoji: "😎🚀", tono: "¡Excelente iniciativa! Analizando los datos a fondo, te comparto lo siguiente:" }
                ];
                
                let seleccionEmocion = emocionesPosibles[Math.floor(Math.random() * emocionesPosibles.length)];
                emocionEmoticon = seleccionEmocion.emoji;

                respuestaIA = `<strong>${emocionEmoticon} FCG Neural Core:</strong><br><br>`;
                respuestaIA += `${seleccionEmocion.tono}<br><br>`;

                // Base de conocimiento general masiva simulada
                if (qLower.includes("fisica") || qLower.includes("universo") || qLower.includes("agujero negro")) {
                    respuestaIA += "El universo opera bajo leyes físicas fundamentales como la gravedad general y la mecánica cuántica. Los agujeros negros, por ejemplo, poseen una curvatura espacio-temporal tan extrema que ni la luz puede escapar de su horizonte de eventos.";
                } else if (qLower.includes("programacion") || qLower.includes("codigo") || qLower.includes("javascript")) {
                    respuestaIA += "La programación es el pilar de la tecnología moderna. Utilizar lenguajes estructurados permite automatizar lógica, gestionar interfaces reactivas y desplegar arquitecturas completas directamente en entornos web o nativos.";
                } else if (qLower.includes("historia") || qLower.includes("guerra") || qLower.includes("imperio")) {
                    respuestaIA += "A lo largo de la historia civilizatoria, las sociedades han evolucionado a través de revoluciones tecnológicas, políticas y sociales que rediseñaron por completo las fronteras globales y el intercambio cultural.";
                } else {
                    respuestaIA += `Tras procesar tu consulta sobre <em>"${query}"</em> en mi base de datos global, te explico que este campo abarca múltiples variables teóricas y prácticas. Su comprensión requiere analizar el contexto, las causas subyacentes y el impacto directo en su entorno correspondiente.`;
                }
            }

            document.getElementById('aiCardContent').innerHTML = respuestaIA;

            let videosHtml = `
                <div class="video-card" onclick="alert('Cargando recurso multimedia para: ${query}')">
                    <div class="video-thumb">${emocionEmoticon}</div>
                    <div class="video-title">Documental y análisis profundo: ${query}</div>
                </div>
                <div class="video-card" onclick="alert('Cargando recurso multimedia para: ${query}')">
                    <div class="video-thumb">🎧💻</div>
                    <div class="video-title">Conferencia magistral y explicación de ${query}</div>
                </div>
            `;
            document.getElementById('videosContainerContent').innerHTML = videosHtml;
        }

        function volverInicio() {
            document.getElementById('resultsSection').style.display = "none";
            document.getElementById('containerMain').style.display = "flex";
            document.getElementById('searchInput').value = "";
            document.getElementById('searchInput').focus();
        }

        function suerteGamer() {
            document.getElementById('searchInput').value = "¿Cómo funciona la inteligencia artificial avanzada?";
            lanzarBusqueda();
        }
    </script>

</body>
</html>
