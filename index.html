<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG Search - Ultimate Neural Engine</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0221, #190933, #2b1055);
            color: #e0d4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 20px;
            font-size: 14px;
        }
        header a {
            color: #bc13fe;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
        }
        header a:hover {
            color: #f3e7ff;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -5vh;
            padding: 0 20px;
        }
        .logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: -2px;
            font-family: 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 20px #bc13fe, 0 0 40px #7b2cbf;
        }
        .subtitle {
            font-size: 22px;
            color: #c77dff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.6);
        }
        .search-box-container {
            display: flex;
            align-items: center;
            width: 650px;
            max-width: 100%;
            height: 55px;
            background-color: rgba(22, 10, 45, 0.9);
            border: 2px solid #7b2cbf;
            border-radius: 30px;
            padding: 0 20px;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.4);
        }
        .search-box-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            background: transparent;
            color: #ffffff;
            margin-left: 10px;
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        .buttons button {
            background: linear-gradient(45deg, #7b2cbf, #bc13fe);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            transition: 0.2s;
        }
        .buttons button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.8);
        }
        
        .results-section {
            display: none;
            width: 750px;
            max-width: 95%;
            margin: 20px auto;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-card {
            background: rgba(15, 5, 30, 0.95);
            border: 2px solid #bc13fe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.3);
            font-size: 16px;
            line-height: 1.6;
        }
        .videos-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .video-card {
            background: rgba(22, 10, 45, 0.9);
            border: 1px solid #7b2cbf;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .video-card:hover {
            border-color: #bc13fe;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
        }
        .video-thumb {
            width: 100%;
            height: 100px;
            background: #2b1055;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .video-title {
            font-size: 13px;
            font-weight: bold;
            color: #f3e7ff;
        }
        
        footer {
            background-color: rgba(10, 3, 20, 0.9);
            color: #9d4edd;
            font-size: 13px;
            padding: 15px 30px;
            border-top: 1px solid #3c096c;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/federicogongora67-debug" target="_blank">GitHub Pro</a>
    </header>

    <div class="main-container" id="containerMain">
        <div class="logo">FCG Search</div>
        <div class="subtitle">Neural Memory Core</div>
        
        <div class="search-box-container">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="#bc13fe" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 10 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <!-- AHORA ESCUCHA LA TECLA ENTER PERFECTAMENTE -->
            <input type="text" id="searchInput" placeholder="Escribe tu pregunta y presiona Enter..." autocomplete="off">
        </div>

        <div class="buttons">
            <button type="button" onclick="lanzarBusqueda()">Consultar</button>
            <button type="button" onclick="suerteGamer()">¡Modo Aleatorio!</button>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="ai-card" id="aiCardContent"></div>

        <h3 style="color: #c77dff; margin-bottom: 12px;">📺 Recursos Multimedia</h3>
        <div class="videos-container" id="videosContainerContent"></div>
        
        <button type="button" onclick="volverInicio()" style="background: #3c096c; border: 1px solid #bc13fe; color: #fff; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Nueva Consulta</button>
    </div>

    <footer>
        ⚡ FCG AI Engine &bull; Con Base de Datos Masiva y Enter Habilitado ⚡
    </footer>

    <script>
        // Evento para enviar automáticamente al presionar la tecla Enter
        document.getElementById('searchInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Evita que el navegador intente ir a Google
                lanzarBusqueda();
            }
        });

        function lanzarBusqueda() {
            let inputElem = document.getElementById('searchInput');
            let query = inputElem.value.trim();
            if(!query) return;

            document.getElementById('containerMain').style.display = "none";
            let resultsDiv = document.getElementById('resultsSection');
            resultsDiv.style.display = "block";

            let qLower = query.toLowerCase();

            // Banco de emociones dinámicas y amables (alegre, fascinado, motivador, curioso) - NUNCA enojado
            const bancoEmociones = [
                { emoji: "🤩🔥", tono: "¡Me entusiasma muchísimo analizar este tema contigo con toda la energía!" },
                { emoji: "✨💖", tono: "¡Qué gran placer me da explicarte algo tan fascinante e interesante!" },
                { emoji: "🚀🎉", tono: "¡Excelente pregunta! Es un gusto total desglosarlo paso a paso para ti:" },
                { emoji: "💡😎", tono: "¡Qué curiosidad tan genial! Vamos a profundizar en ello con total precisión:" }
            ];

            let emocionElegida = bancoEmociones[Math.floor(Math.random() * bancoEmociones.length)];

            // Base de conocimiento masiva simulada con todo tipo de temas técnicos, matemáticos, de juegos y cultura general
            let contenidoExplicacion = "";

            if (qLower.includes("quién soy") || qLower.includes("sabes quién soy") || qLower.includes("mi nombre")) {
                contenidoExplicacion = "No tengo idea de quién eres, ya que para mí eres un usuario completamente anónimo y desconocido explorando el sistema.";
            } else if (qLower.includes("raiz de 8") || qLower.includes("raíz de 8")) {
                contenidoExplicacion = "La raíz cuadrada de 8 (√8) es aproximadamente <strong>2.8284</strong>. Se obtiene descomponiendo el 8 para simplificarlo matemáticamente como 2 multiplicado por la raíz cuadrada de 2.";
            } else if (qLower.includes("raiz de 9") || qLower.includes("raíz de 9")) {
                contenidoExplicacion = "La raíz cuadrada de 9 (√9) es exactamente <strong>3</strong>, ya que al multiplicar 3 por 3 obtenemos 9.";
            } else if (qLower.includes("roblox") || qLower.includes("script") || qLower.includes("lua") || qLower.includes("studio")) {
                contenidoExplicacion = "Roblox utiliza el lenguaje de programación <strong>Lua</strong> dentro de Roblox Studio. Permite programar scripts tanto en el servidor como en el cliente para crear mecánicas de juego, interfaces dinámicas y sistemas avanzados.";
            } else if (qLower.includes("espacio") || qLower.includes("universo") || qLower.includes("agujero negro") || qLower.includes("fisica") || qLower.includes("gravedad")) {
                contenidoExplicacion = "El universo comprende todo el espacio, la materia y la energía. Los agujeros negros son regiones del espacio-tiempo con una gravedad tan descomunal que ni siquiera la luz puede escapar de su horizonte de eventos.";
            } else if (qLower.includes("programacion") || qLower.includes("codigo") || qLower.includes("javascript") || qLower.includes("html") || qLower.includes("css")) {
                contenidoExplicacion = "La programación es el proceso de crear instrucciones lógicas para que una computadora ejecute tareas. HTML estructura la página, CSS diseña la interfaz visual y JavaScript controla la interactividad y los eventos.";
            } else if (qLower.includes("historia") || qLower.includes("guerra") || qLower.includes("imperio") || qLower.includes("civilizacion")) {
                contenidoExplicacion = "La historia humana está marcada por eras de gran transformación social, política y tecnológica, desde las primeras civilizaciones fluviales y el imperio romano hasta la revolución digital moderna.";
            } else if (qLower.includes("motor") || qLower.includes("moto") || qLower.includes("110cc") || qLower.includes("vehiculo")) {
                contenidoExplicacion = "Las motocicletas de 110cc son vehículos ligeros y urbanos, ideales para trayectos diarios gracias a su consumo sumamente reducido de combustible y su facilidad de manejo.";
            } else if (qLower.includes("vr") || qLower.includes("realidad virtual") || qLower.includes("visor") || qLower.includes("gafas")) {
                contenidoExplicacion = "La realidad virtual (VR) sumerge al usuario en entornos digitales tridimensionales mediante visores especializados que rastrean el movimiento para ofrecer una experiencia totalmente inmersiva.";
            } else {
                contenidoExplicacion = `Analizando detalladamente tu consulta sobre <em>"${query}"</em>, te comparto que abarca conceptos clave, principios teóricos profundos y múltiples aplicaciones prácticas que determinan su funcionamiento en el entorno real.`;
            }

            // Formato exacto solicitado con "chat FCG:" y sus emociones integradas
            let respuestaFinal = `<strong>chat FCG:</strong> ${emocionElegida.emoji} ${emocionElegida.tono}<br><br>${contenidoExplicacion}`;

            document.getElementById('aiCardContent').innerHTML = respuestaFinal;

            let videosHtml = `
                <div class="video-card" onclick="alert('Cargando recurso multimedia')">
                    <div class="video-thumb">${emocionElegida.emoji}</div>
                    <div class="video-title">Análisis detallado y guía de: ${query}</div>
                </div>
                <div class="video-card" onclick="alert('Cargando recurso multimedia')">
                    <div class="video-thumb">🎧✨</div>
                    <div class="video-title">Explicación avanzada sobre ${query}</div>
                </div>
            `;
            document.getElementById('videosContainerContent').innerHTML = videosHtml;
        }

        function volverInicio() {
            document.getElementById('resultsSection').style.display = "none";
            document.getElementById('containerMain').style.display = "flex";
            document.getElementById('searchInput').value = "";
            document.getElementById('searchInput').focus();
        }

        function suerteGamer() {
            document.getElementById('searchInput').value = "¿Cómo funciona la inteligencia artificial avanzada?";
            lanzarBusqueda();
        }
    </script>

</body>
</html>
