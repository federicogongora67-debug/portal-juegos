<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCG Search - Ultimate AI Engine</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0221, #190933, #2b1055);
            color: #e0d4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 20px;
            font-size: 14px;
        }
        header a {
            color: #bc13fe;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
        }
        header a:hover {
            color: #f3e7ff;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -5vh;
            padding: 0 20px;
        }
        .logo {
            font-size: 85px;
            font-weight: 900;
            letter-spacing: -2px;
            font-family: 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 20px #bc13fe, 0 0 40px #7b2cbf;
        }
        .subtitle {
            font-size: 22px;
            color: #c77dff;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.6);
        }
        .search-box-container {
            display: flex;
            align-items: center;
            width: 650px;
            max-width: 100%;
            height: 55px;
            background-color: rgba(22, 10, 45, 0.9);
            border: 2px solid #7b2cbf;
            border-radius: 30px;
            padding: 0 20px;
            box-shadow: 0 0 25px rgba(123, 44, 191, 0.4);
        }
        .search-box-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            background: transparent;
            color: #ffffff;
            margin-left: 10px;
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }
        .buttons button {
            background: linear-gradient(45deg, #7b2cbf, #bc13fe);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            padding: 12px 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.4);
            transition: 0.2s;
        }
        .buttons button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.8);
        }
        
        .results-section {
            display: none;
            width: 750px;
            max-width: 95%;
            margin: 20px auto;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-card {
            background: rgba(15, 5, 30, 0.95);
            border: 2px solid #bc13fe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.3);
            font-size: 16px;
            line-height: 1.6;
        }
        
        footer {
            background-color: rgba(10, 3, 20, 0.9);
            color: #9d4edd;
            font-size: 13px;
            padding: 15px 30px;
            border-top: 1px solid #3c096c;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/federicogongora67-debug" target="_blank">GitHub Pro</a>
    </header>

    <div class="main-container" id="containerMain">
        <div class="logo">FCG Search</div>
        <div class="subtitle">Ultimate AI Neural Core</div>
        
        <div class="search-box-container">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="#bc13fe" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 10 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" id="searchInput" placeholder="Escribe cualquier pregunta, cálculo o duda y presiona Enter..." autocomplete="off">
        </div>

        <div class="buttons">
            <button type="button" onclick="lanzarBusqueda()">Enviar Mensaje</button>
            <button type="button" onclick="suerteGamer()">¡Modo Aleatorio!</button>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div class="ai-card" id="aiCardContent"></div>
        
        <button type="button" onclick="volverInicio()" style="background: #3c096c; border: 1px solid #bc13fe; color: #fff; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Escribir otro mensaje</button>
    </div>

    <footer>
        ⚡ FCG Chat &bull; Inteligencia Total y Motor Matemático Avanzado ⚡
    </footer>

    <script>
        document.getElementById('searchInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                lanzarBusqueda();
            }
        });

        function extraerNumero(texto) {
            let match = texto.match(/-?\d+(\.\d+)?/);
            return match ? parseFloat(match[0]) : null;
        }

        function lanzarBusqueda() {
            let inputElem = document.getElementById('searchInput');
            let query = inputElem.value.trim();
            if(!query) return;

            document.getElementById('containerMain').style.display = "none";
            let resultsDiv = document.getElementById('resultsSection');
            resultsDiv.style.display = "block";

            let qLower = query.toLowerCase();

            const bancoEmociones = [
                { emoji: "😎👊", tono: "¡Uf, claro que sí! Mira, analizando eso te cuento lo siguiente:" },
                { emoji: "🔥🙌", tono: "¡Es una pasada ese tema! Te explico al detalle cómo viene la mano:" },
                { emoji: "⚡😂", tono: "¡Jajaja, temazo trajiste! Anótate esta info que te tiro:" },
                { emoji: "🚀😎", tono: "¡Obvio, pa! Te lo resumo rapidito y bien explicado:" }
            ];

            let emocionElegida = bancoEmociones[Math.floor(Math.random() * bancoEmociones.length)];
            let contenidoExplicacion = "";
            let num = extraerNumero(qLower);

            // MOTOR INTELIGENTE INTEGRAL (Matemáticas, Programación, Ciencia y Cultura General)
            if ((qLower.includes("raiz") || qLower.includes("raíz")) && num !== null) {
                let res = Math.sqrt(num);
                contenidoExplicacion = `La raíz cuadrada de ${num} es exactamente <strong>${res}</strong>. ¡Calculado al toque, bro!`;
            } else if ((qLower.includes("log") || qLower.includes("logaritmo")) && num !== null) {
                let log10 = Math.log10(num).toFixed(4);
                let ln = Math.log(num).toFixed(4);
                contenidoExplicacion = `Para el número ${num}: el logaritmo base 10 es <strong>${log10}</strong> y el logaritmo natural (ln) es <strong>${ln}</strong>. ¡Todo exacto!`;
            } else if ((qLower.includes("cuadrado") || qLower.includes("potencia")) && num !== null) {
                let res = Math.pow(num, 2);
                contenidoExplicacion = `El cuadrado de ${num} (${num} × ${num}) da como resultado <strong>${res}</strong>. ¡Facilísimo!`;
            } else if (qLower.includes("cubo") && num !== null) {
                let res = Math.pow(num, 3);
                contenidoExplicacion = `El cubo de ${num} es igual a <strong>${res}</strong>. ¡Memoria matemática al 100%!`;
            } else if (qLower.includes("porcentaje") || qLower.includes("%")) {
                let numeros = qLower.match(/-?\d+(\.\d+)?/g);
                if (numeros && numeros.length >= 2) {
                    let p = parseFloat(numeros[0]);
                    let t = parseFloat(numeros[1]);
                    let res = (p * t) / 100;
                    contenidoExplicacion = `El ${p}% de ${t} es <strong>${res}</strong>. ¡Listo para sacarle provecho!`;
                } else {
                    contenidoExplicacion = "Para sacar porcentajes, pásame los datos bien, por ejemplo: '15 por ciento de 200' y te lo calculo.";
                }
            } else if (qLower.includes("roblox") || qLower.includes("script") || qLower.includes("lua") || qLower.includes("studio") || qLower.includes("juego")) {
                contenidoExplicacion = "En Roblox se utiliza el lenguaje <strong>Lua</strong> dentro de Roblox Studio. Sirve para programar scripts de servidor y cliente, creando mecánicas, interfaces y sistemas interactivos avanzados.";
            } else if (qLower.includes("espacio") || qLower.includes("universo") || qLower.includes("agujero negro") || qLower.includes("fisica") || qLower.includes("gravedad")) {
                contenidoExplicacion = "El universo abarca todo el espacio y la materia. Los agujeros negros poseen una gravedad tan extrema que deforman el espacio-tiempo e impiden que incluso la luz escape.";
            } else if (qLower.includes("programacion") || qLower.includes("codigo") || qLower.includes("javascript") || qLower.includes("html") || qLower.includes("css")) {
                contenidoExplicacion = "La programación permite dar instrucciones lógicas a las computadoras. HTML estructura el contenido, CSS diseña la interfaz visual y JavaScript controla toda la interactividad.";
            } else if (qLower.includes("motor") || qLower.includes("moto") || qLower.includes("110cc") || qLower.includes("vehiculo")) {
                contenidoExplicacion = "Las motos de 110cc son vehículos urbanos muy eficientes, ligeros y con un consumo de combustible sumamente bajo, perfectos para el día a día.";
            } else if (qLower.includes("ia") || qLower.includes("inteligencia artificial") || qLower.includes("chatbot")) {
                contenidoExplicacion = "La inteligencia artificial simula procesos cognitivos humanos mediante redes neuronales y algoritmos masivos para procesar lenguaje, resolver problemas y generar contenido.";
            } else {
                contenidoExplicacion = `Analizando a fondo tu consulta sobre <em>"${query}"</em>, te comparto que abarca conceptos clave, principios teóricos avanzados y múltiples aplicaciones prácticas que determinan su funcionamiento en el mundo real.`;
            }

            let respuestaFinal = `<strong>chat FCG:</strong> ${emocionElegida.emoji} ${emocionElegida.tono}<br><br>${contenidoExplicacion}`;

            document.getElementById('aiCardContent').innerHTML = respuestaFinal;
        }

        function volverInicio() {
            document.getElementById('resultsSection').style.display = "none";
            document.getElementById('containerMain').style.display = "flex";
            document.getElementById('searchInput').value = "";
            document.getElementById('searchInput').focus();
        }

        function suerteGamer() {
            document.getElementById('searchInput').value = "raíz cuadrada de 225";
            lanzarBusqueda();
        }
    </script>

</body>
</html>
