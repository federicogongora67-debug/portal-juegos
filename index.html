<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal de Juegos - Roblox Edition</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff334b;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            width: 340px;
        }
        .btn {
            background-color: #ff334b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e0243b;
        }
        canvas {
            background-color: #090d16;
            border: 2px solid #475569;
            border-radius: 8px;
            margin-top: 10px;
        }
        #stats {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>🟥 ROBLOX WEB ARCADE</h1>
    <p>Simulador de Bloques y Obstáculos en tu propia página.</p>

    <div class="container">
        <!-- Minijuego estilo Roblox -->
        <div class="card">
            <h3>Blox Escape: Parkour 2D</h3>
            <p>Usa la barra <b>Espacio</b> para saltar los bloques rojos.</p>
            <div id="stats">Puntuación: 0</div>
            <canvas id="gameCanvas" width="300" height="150"></canvas>
            <br>
            <button class="btn" onclick="reiniciarJuego()">Reiniciar / Jugar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 30, y: 100, width: 20, height: 20, vy: 0, gravity: 0.6, jump: -9, grounded: false };
        let obstacle = { x: 300, y: 105, width: 15, height: 45, speed: 4 };
        let score = 0;
        let jugando = true;

        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (player.grounded) {
                    player.vy = player.jump;
                    player.grounded = false;
                }
            }
        });

        function actualizar() {
            if (!jugando) return;

            // Física del jugador
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y > 105) {
                player.y = 105;
                player.vy = 0;
                player.grounded = true;
            }

            // Movimiento del obstáculo
            obstacle.x -= obstacle.speed;
            if (obstacle.x < -20) {
                obstacle.x = 320;
                score += 10;
                obstacle.speed += 0.2; // Cada vez más rápido
            }

            // Colisión (Game Over)
            if (
                player.x < obstacle.x + obstacle.width &&
                player.x + player.width > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                jugando = false;
            }

            document.getElementById('stats').innerText = "Puntuación: " + score;
        }

        function dibujar() {
            // Limpiar pantalla
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Suelo
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 125, canvas.width, 25);

            // Jugador (Estilo Roblox Noob/Avatar)
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Obstáculo
            ctx.fillStyle = '#ff334b';
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

            if (!jugando) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('¡GAME OVER!', 95, 75);
            }
        }

        let loop = setInterval(function() {
            actualizar();
            dibujar();
        }, 1000 / 60);

        function reiniciarJuego() {
            player.y = 105;
            player.vy = 0;
            obstacle.x = 300;
            obstacle.speed = 4;
            score = 0;
            jugando = true;
        }
    </script>

</body>
</html>
